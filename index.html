<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CN40 | Centro de Operaciones</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="fondo"></div>

    <div class="panel">

        <div class="logo">🛰️</div>

        <h1>CN40</h1>

        <h2>Centro de Operaciones</h2>

        <div class="estado">
            ● Sistema operativo
        </div>

        <br><br>

        <button onclick="activar()">
            Iniciar operación
        </button>

        <div id="mensaje">

            <h3>✔ Acceso concedido</h3>

            <p style="margin-top:15px;">
                Bienvenido al Centro de Operaciones CN40.
                <br><br>
                La verdad se descubre. No se entrega.
            </p>

        </div>

    </div>

    <script>
        function activar() {
            document.getElementById("mensaje").style.display = "block";
        }
    </script>

</body>

</html>
